<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>نظام الكاشير والمبيعات للسيبرماركت</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>

<body>
    <div id="app">
        <div class="splash-screen">
            <div class="spinner"></div>
            <h2>نظام إدارة السوبرماركت والكاشير</h2>
            <p>جاري تحميل التطبيق...</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        حدث خطأ غير متوقع.
        <a href="" class="reload">إعادة تحميل</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webview.js"></script>
    <script>
        window.setAppTheme = function (theme) {
            document.documentElement.setAttribute('data-theme', theme);
            try { localStorage.setItem('pos_theme', theme); } catch (e) {}
        };

        window.getAppTheme = function () {
            try {
                return localStorage.getItem('pos_theme') || 'dark';
            } catch (e) {
                return 'dark';
            }
        };

        (function () {
            const savedTheme = window.getAppTheme();
            document.documentElement.setAttribute('data-theme', savedTheme);
            document.documentElement.setAttribute('dir', 'rtl');
            document.documentElement.setAttribute('lang', 'ar');
        })();

        window.printPdfFromBase64 = function (base64String) {
            const blob = base64ToBlob(base64String, 'application/pdf');
            const url = URL.createObjectURL(blob);
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = url;
            document.body.appendChild(iframe);
            iframe.contentWindow.focus();
            iframe.contentWindow.print();
        };

        function base64ToBlob(base64, type) {
            const binStr = atob(base64);
            const len = binStr.length;
            const arr = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                arr[i] = binStr.charCodeAt(i);
            }
            return new Blob([arr], { type: type });
        }
    </script>
</body>
</html>
